name: Publish desktop Beta

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    env:
      # Keep runtime preparation aligned with the installer target, including
      # macOS cross-builds whose architecture differs from the runner.
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/agent-host/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # candle-onnx generates Rust bindings while compiling the speech runtime.
      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Protocol Buffers compiler
        run: protoc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install frontend and build dependencies
        run: npm ci
      # The release overlay stages the CLI sidecar after pinned target Node,
      # the isolated host lockfile, and Record + Source + Pi resources.
      - name: Build complete desktop resources and installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ProjectMind ${{ github.ref_name }}
          releaseBody: |
            ProjectMind Beta 桌面版本。应用升级不会删除或移动 Workspace；首次安装前仍建议保留一份独立备份。
          releaseDraft: true
          prerelease: true
          retryAttempts: 2
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: ProjectMind_[version]_[platform]_[arch][setup].[ext]
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

  publish-channel:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Download and validate updater manifest
        run: |
          mkdir -p updater-channel
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir updater-channel
          node scripts/validate-updater-manifest.mjs updater-channel/latest.json
      - name: Publish Beta release
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          path: release-repository
      - name: Advance public Beta channel
        run: |
          cd release-repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ..
          node scripts/advance-beta-channel.mjs release-repository updater-channel/latest.json
