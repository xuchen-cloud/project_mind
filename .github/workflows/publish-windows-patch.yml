name: Publish Windows patch

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Windows patch tag, for example v0.1.3-windows.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-patch-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-windows-patch:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Validate Windows patch version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/validate-windows-patch-version.mjs "$env:RELEASE_TAG"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ inputs.tag }}
          releaseName: ProjectMind ${{ inputs.tag }} (Windows patch)
          releaseBody: |
            ProjectMind Windows 补丁包，仅供 Windows 测试者手动下载安装。
            本次发布不会推进 Beta 自动更新频道，也不会构建或替换 macOS 安装包。
          releaseDraft: true
          prerelease: true
          retryAttempts: 2
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: ProjectMind_[version]_[platform]_[arch][setup].[ext]
          args: --target x86_64-pc-windows-msvc --bundles nsis
      - name: Publish Windows patch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease
