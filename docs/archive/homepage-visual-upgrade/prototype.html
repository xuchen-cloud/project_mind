<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nori Mind · 首页视觉稿</title>
  <style>
    :root{font-family:Inter,"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#151719;background:#e7e8ea;font-size:15px;--line:#e4e6e9;--muted:#647089;--blue:#2878f4}body{margin:0}
    *{box-sizing:border-box}[hidden]{display:none!important}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .controls{height:46px;display:flex;align-items:center;gap:8px;padding:5px 14px;background:#202226;color:white}.controls strong{margin-right:12px;font-size:13px}.controls button{border:1px solid #5a5d63;border-radius:6px;background:#34373c;color:white;padding:5px 10px;font-size:12px}.controls button.active{background:#2878f4;border-color:#2878f4}.controls .hint{margin-left:auto;color:#bcc0c7;font-size:12px}
    .frame{height:calc(100vh - 46px);min-height:400px;display:grid;grid-template-columns:260px minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr);background:#fafaf8;overflow:hidden;border-radius:0 0 12px 12px}
    .sidebar{display:flex;flex-direction:column;border-right:1px solid var(--line);background:#f7f7f5;min-width:0;min-height:0;overflow:auto}.traffic{height:44px;padding:14px 16px;display:flex;gap:8px}.traffic i{width:12px;height:12px;border-radius:50%;background:#ef6964}.traffic i:nth-child(2){background:#f5b950}.traffic i:nth-child(3){background:#59b866}.brand{height:80px;padding:10px 20px;display:flex;align-items:center;gap:9px;font-size:25px;font-weight:760;letter-spacing:-1.2px}.brand img{width:54px;height:54px;object-fit:cover;object-position:top;border-radius:15px}.brand em{font-style:normal;color:#626876;font-weight:500}.brand b{position:relative}.brand b:after{content:"";position:absolute;width:6px;height:6px;top:2px;right:26px;border-radius:50%;background:var(--blue)}
    .scope{height:40px;margin:0 14px 25px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:white;display:flex;align-items:center;justify-content:space-between;font-weight:600}.side-section{padding:0 13px}.section-title{display:flex;align-items:center;justify-content:space-between;color:#5d6b85;font-size:16px;font-weight:700;margin:4px 11px 13px}.section-title button,.rail-title button{border:0;background:transparent;color:#1c2130;font-size:25px;line-height:1;padding:1px 4px}.side-item{min-height:42px;display:flex;align-items:center;gap:13px;width:100%;padding:0 15px;margin:3px 0;border:0;border-radius:7px;background:transparent;color:#1b2232;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side-item:hover{background:#eeeef0}.side-item.active{background:#ececed;color:#171b27;position:relative}.side-item.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);border-radius:3px}.side-item .sym{width:24px;flex:none;text-align:center;font-size:19px;font-weight:400}.side-divider{height:1px;background:var(--line);margin:25px 11px 24px}.side-bottom{margin-top:auto;padding:15px}.side-bottom .side-item{margin-top:4px}
    .center-shell{min-width:0;min-height:0;display:flex;flex-direction:column}.topbar{height:52px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:stretch;padding:0 12px;gap:3px;overflow:hidden;background:#fafafa}.tab{display:flex;align-items:center;gap:10px;border:0;border-bottom:2px solid transparent;background:transparent;color:#626b7c;padding:0 17px;white-space:nowrap;font-weight:600}.tab.active{color:#1a2335;border-color:var(--blue);background:white}.tab .sym{font-size:20px}.tab.add{font-size:24px;padding:0 14px}.global-search{margin:auto 8px auto auto;background:#fff;border:1px solid var(--line);border-radius:8px;height:36px;max-width:220px;min-width:100px;padding:7px 12px;color:#8891a2}.scroll{overflow:auto;min-height:0;height:100%}.main{max-width:1100px;margin:auto;padding:8px 16px 48px}
    .hero{height:198px;border-radius:10px;position:relative;overflow:hidden;background-image:linear-gradient(to bottom,transparent 28%,rgba(255,255,255,.16) 52%,#fafaf8 100%),url('assets/alpine-cover.png');background-size:cover;background-position:center}.hero .identity{position:absolute;left:20px;bottom:9px;display:flex;gap:16px;align-items:center}.identity-icon{width:76px;height:76px;border-radius:12px;background:rgba(255,255,255,.64);backdrop-filter:blur(14px);display:grid;place-items:center;font-size:42px;color:#151719;box-shadow:0 1px 8px #2d334214}.identity h1{font-size:29px;line-height:1.25;margin:0 0 3px;letter-spacing:-.7px}.identity small{font-size:14px;color:#66748b}.edit-cover{position:absolute;right:13px;bottom:13px;border:1px solid #ffffff9e;background:#fffc;border-radius:7px;padding:7px 10px;opacity:0}.hero:hover .edit-cover,.hero:focus-within .edit-cover{opacity:1}
    .quick{position:sticky;top:0;z-index:2;margin-top:7px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 2px 12px #14181f09;overflow:hidden}.quick-head{height:48px;display:flex;align-items:center;padding:0 20px;font-size:17px;font-weight:740}.save{margin-left:auto;color:#64806c;font-weight:500;font-size:13px}.save.error{color:#b94a45}.expand{border:0;background:transparent;font-size:20px;margin-left:18px}.editor{min-height:122px;max-height:min(340px,40vh);overflow:auto;padding:10px 22px 14px;line-height:1.9;font-weight:530;outline:none}.editor p{margin:0}.hash{color:var(--blue)}.quick-foot{height:62px;border-top:1px solid var(--line);margin:0 13px;display:flex;align-items:center;gap:7px}.tool{border:0;background:transparent;width:34px;height:34px;font-size:20px;color:#1b2335}.tool:hover{background:#f0f1f2;border-radius:5px}.split{margin-left:auto;height:42px;display:flex;border-radius:7px;overflow:hidden;background:#25272a;color:white}.split button{border:0;color:white;background:transparent;padding:0 18px}.split button+button{border-left:1px solid #777;padding:0 12px}.menu{position:absolute;right:13px;bottom:56px;background:white;border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 8px 30px #10152020}.menu button{border:0;background:white;padding:8px 12px;display:block;text-align:left;width:190px}.menu button:hover{background:#f1f2f3}
    .records-title{margin:27px 5px 13px;display:flex;align-items:center;gap:10px}.records-title h2{font-size:23px;margin:0 9px 0 0}.filter-chip{border:0;background:#f0f1f3;border-radius:18px;padding:6px 10px;color:#293247;font-weight:600;font-size:13px}.records-title input{margin-left:auto;min-width:160px;width:28%;height:37px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:#fff}.sort{height:37px;border:1px solid var(--line);background:white;border-radius:7px;padding:0 12px;color:#273043}.record-card{border:1px solid var(--line);border-radius:9px;background:white;min-height:116px;margin:10px 2px;padding:16px 20px;display:flex;gap:18px;box-shadow:0 1px 3px #1c203008}.record-card h3{font-size:17px;margin:0 0 6px}.record-card p{color:var(--muted);margin:0 0 8px;line-height:1.55}.record-card .card-content{flex:1;min-width:0}.record-card .card-meta{color:#7d8aa4;font-size:12px;white-space:nowrap}.pills{display:flex;gap:6px}.pill{color:#647089;background:#f3f4f5;padding:3px 10px;border-radius:20px;font-size:12px}.thumb{width:150px;height:88px;object-fit:cover;border-radius:7px;align-self:end}.empty{border:1px dashed #cdd2d8;border-radius:10px;padding:45px;text-align:center;color:#69758b;background:#fff}
    .rail{background:#fdfdfc;border-left:1px solid var(--line);min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}.rail-section{padding:24px 20px 15px;overflow:auto;min-height:0}.rail.workspace .rail-section{flex:1 1 0}.rail.project .todo-section{height:42%;min-height:220px;border-bottom:1px solid var(--line)}.rail.project .files-section{flex:1}.rail-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.rail-title h2{font-size:23px;margin:0}.rail-sub{color:#7685a0;font-weight:550;margin:0 0 19px}.mode{display:flex;border-bottom:1px solid var(--line);gap:20px;margin:0 0 14px}.mode button{border:0;border-bottom:3px solid transparent;background:transparent;color:#697792;padding:0 5px 12px;font-size:13px}.mode button.active{border-color:var(--blue);color:#1b2537;font-weight:650}.todo{display:flex;align-items:flex-start;gap:12px;margin:15px 0 20px}.circle{border:2px solid #8795ad;width:24px;height:24px;border-radius:50%;background:white;flex:none}.todo b{font-size:15px}.todo small{display:block;margin-top:5px;color:#7887a2}.file{display:flex;align-items:center;gap:11px;margin:15px 0}.file-icon{width:42px;height:42px;border-radius:7px;background:#f2f2f2;display:grid;place-items:center;color:#313743;font-size:20px}.file-name{font-size:13px;font-weight:600}.file small{display:block;color:#7788a2;margin-top:4px}.file .more{margin-left:auto;border:0;background:none;font-size:18px}.mascot{height:265px;flex:none;position:relative;padding:35px 25px;color:#56637b;line-height:1.7}.mascot p{margin:0}.mascot small{display:block;margin-top:12px}.mascot img{position:absolute;bottom:0;right:10px;width:150px;height:137px;object-fit:contain;object-position:bottom}
    .modal-wrap{position:fixed;inset:0;background:#13182070;z-index:30;display:grid;place-items:center}.modal{width:min(760px,calc(100vw - 32px));height:min(780px,calc(100vh - 32px));background:white;border-radius:12px;display:flex;flex-direction:column;box-shadow:0 18px 60px #0003}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px}.modal-head button{border:0;background:none;font-size:24px}.modal textarea{margin:22px;flex:1;resize:none;border:0;outline:none;font-size:17px;line-height:1.8}.modal-foot{padding:15px 22px;border-top:1px solid var(--line);text-align:right}.modal-foot button{background:#25272a;color:white;border:0;border-radius:7px;padding:9px 20px}
    .frame.narrow{width:950px;max-width:100%;grid-template-columns:224px minmax(0,1fr)}.frame.narrow .rail{display:none}.frame.narrow .global-search{display:none}.frame.narrow .main{padding:8px 12px}.frame.short{height:560px}.frame.short .hero{height:145px}.frame.short .mascot{display:none}.frame.short .editor{max-height:220px}
    @media(max-width:1050px){.frame:not(.narrow){grid-template-columns:224px minmax(0,1fr) 300px}.brand{font-size:20px}.rail-section{padding-left:14px;padding-right:14px}.mascot{height:220px}.mascot img{width:120px;height:110px}}
    @media(max-width:800px){.frame:not(.narrow){grid-template-columns:0 minmax(0,1fr) 0}.frame:not(.narrow) .sidebar,.frame:not(.narrow) .rail{display:none}.controls .hint{display:none}.topbar{overflow:auto}.global-search{display:none}}
  </style>
</head>
<body>
  <div class="controls"><strong>首页视觉稿 · 第一版</strong><button id="workspace" class="active">Workspace</button><button id="project">Project</button><button id="filtered">标签筛选</button><button id="empty">空态</button><button id="long">长列表</button><button id="narrow">窄窗</button><button id="short">矮窗</button><button id="saveerror">保存失败</button><span class="hint">点击状态按钮切换；QuickNote 可输入、展开与打开追加菜单</span></div>
  <div class="frame" id="frame">
    <aside class="sidebar"><div class="traffic"><i></i><i></i><i></i></div><div class="brand"><img src="assets/nori-bust.png" alt=""><span><b>Nori</b><em>Mind</em></span></div><button class="scope">⌂　我的工作区 <span>⌄</span></button><div class="side-section"><div class="section-title"><span id="upper-title">项目</span><button aria-label="创建">＋</button></div><div id="upper-list"></div><div class="side-divider"></div><div class="section-title"><span id="tag-title">工作区标签</span></div><div id="tag-list"></div></div><div class="side-bottom"><button class="side-item" id="archive">▣　归档项目</button><button class="side-item">⚙　设置</button></div></aside>
    <div class="center-shell"><nav class="topbar"><button class="tab" id="workspace-tab"><span class="sym">⌂</span>工作区</button><button class="tab" id="project-tab"><span class="sym">◈</span>品牌升级</button><button class="tab"><span class="sym">▤</span>产品路线图</button><button class="tab"><span class="sym">♧</span>客户访谈</button><button class="tab add">＋</button><span class="global-search">⌕　搜索...</span></nav><div class="scroll"><main class="main"><section class="hero"><div class="identity"><div class="identity-icon" id="identity-icon">⌂</div><div><h1 id="page-title">我的工作区</h1><small id="breadcrumb">工作区</small></div></div><button class="edit-cover">✎　编辑封面</button></section><section class="quick"><div class="quick-head">QuickNote <span class="save" id="save">●　已自动保存</span><button class="expand" id="expand" aria-label="展开 QuickNote">⤢</button></div><div class="editor" id="editor" contenteditable="true" role="textbox" aria-multiline="true"><p>先记下今天需要梳理的想法。</p><p>汇总跨项目的协作约定和常用资料。</p><p><span class="hash">#工作方法</span>　<span class="hash">#协作</span></p></div><div class="quick-foot"><button class="tool">𝐁</button><button class="tool">𝘐</button><button class="tool">♧</button><button class="tool">▧</button><button class="tool">☷</button><button class="tool">&lt;/&gt;</button><div class="split"><button id="store">存为记录</button><button id="more" aria-label="更多转存方式">⌄</button></div></div><div class="menu" id="menu" hidden><button>追加到记录…</button></div></section><div class="records-title"><h2 id="records-heading">工作区记录</h2><button class="filter-chip" id="filter-chip" hidden>＃工作方法　×</button><input aria-label="搜索记录" placeholder="⌕　搜索记录" id="search"><button class="sort">最新修改　⌄</button></div><div id="records"></div></main></div></div>
    <aside class="rail workspace" id="rail"><section class="rail-section todo-section"><div class="rail-title"><h2>待办</h2><button aria-label="新建待办">＋</button></div><div class="rail-sub" id="todo-sub">工作区与活跃项目</div><div class="mode" id="mode" hidden><button class="active">当前项目</button><button>整个工作区</button></div><div id="todos"></div></section><section class="rail-section files-section" id="files-section" hidden><div class="rail-title"><h2>文件</h2><button aria-label="上传文件">⇧</button></div><div id="files"></div></section><div class="mascot" id="mascot"><p>“让好想法，<br>　在有上下文的地方持续推进。”</p><small>— Nori Mind</small><img src="assets/nori-bust.png" alt="Nori 小熊"></div></aside>
  </div>
  <div class="modal-wrap" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-label="展开 QuickNote"><div class="modal-head">QuickNote <button id="close" aria-label="关闭">×</button></div><textarea id="modal-editor"></textarea><div class="modal-foot"><button id="modal-store">存为记录</button></div></div></div>
  <script>
    const $=id=>document.getElementById(id); const state={scope:'workspace',filtered:false,empty:false,long:false,narrow:false,short:false,saveerror:false};
    const workspaceRecords=[['跨项目协作备忘','统一评审节奏，明确资料归档与跟进方式。','工作方法','协作'],['每周复盘方法','记录复盘流程，检查清单和关键问题。','工作方法','复盘'],['灵感收集规则','让零散想法有可回访的上下文。','灵感','资料']];
    const projectRecords=[['品牌视觉方向确认','以黑白灰建立清晰的信息层级，用蓝色强调关键操作。','视觉设计','品牌'],['封面与页头样式','封面自然渐隐到白色，项目图标使用半透明毛玻璃底座。','视觉设计','交互设计'],['项目页交互评审','检查首页各模块在窄窗和矮窗中的行为。','产品体验','交互设计']];
    const buttons=['workspace','project','filtered','empty','long','narrow','short','saveerror'];
    function render(){const p=state.scope==='project';$('frame').className='frame'+(state.narrow?' narrow':'')+(state.short?' short':'');$('rail').className='rail '+(p?'project':'workspace');$('workspace-tab').classList.toggle('active',!p);$('project-tab').classList.toggle('active',p);$('workspace').classList.toggle('active',!p);$('project').classList.toggle('active',p);for(const k of ['filtered','empty','long','narrow','short','saveerror'])$(k).classList.toggle('active',state[k]);$('upper-title').textContent=p?'最近记录':'项目';$('tag-title').textContent=p?'项目标签':'工作区标签';$('archive').hidden=p;$('page-title').textContent=p?'品牌升级':'我的工作区';$('identity-icon').textContent=p?'◈':'⌂';$('breadcrumb').textContent=p?'我的工作区　/　品牌升级':'工作区';$('records-heading').textContent=p?'记录':'工作区记录';$('todo-sub').hidden=p;$('mode').hidden=!p;$('files-section').hidden=!p;$('mascot').hidden=p;
      const upper=p?['品牌视觉方向确认','项目页交互评审','素材整理与使用约定']:['品牌升级','产品路线图','客户访谈'];$('upper-list').innerHTML=upper.map((x,i)=>`<button class="side-item"><span class="sym">${p?'▤':['◈','▦','♧'][i]}</span>${x}</button>`).join('');const tags=p?['视觉设计','品牌','产品体验','交互设计','素材管理']:['工作方法','协作','资料','模板','灵感'];$('tag-list').innerHTML='<button class="side-item '+(!state.filtered?'active':'')+'" data-tag="all"><span class="sym">○</span>全部记录</button>'+tags.map((x,i)=>`<button class="side-item ${state.filtered&&i===0?'active':''}" data-tag="${x}"><span class="sym">#</span>${x}</button>`).join('');document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{state.filtered=b.dataset.tag!=='all';render()});$('filter-chip').hidden=!state.filtered;$('filter-chip').textContent='＃'+tags[0]+'　×';$('filter-chip').onclick=()=>{state.filtered=false;render()};const data=p?projectRecords:workspaceRecords;let shown=state.empty?[]:state.filtered?data.filter(x=>x[2]===tags[0]):data;if(state.long)shown=[...shown,...shown,...shown,...shown];const query=$('search').value.trim();if(query)shown=shown.filter(x=>x.join('').includes(query));$('records').innerHTML=shown.length?shown.map((x,i)=>`<article class="record-card"><div class="card-content"><h3>${x[0]}</h3><p>${x[1]}</p><div class="pills"><span class="pill">${x[2]}</span><span class="pill">${x[3]}</span></div></div>${p&&i%3===1?'<img class="thumb" src="assets/alpine-cover.png" alt="封面缩略图">':''}<div class="card-meta">${i?'昨天':'今天 14:30'}　···</div></article>`).join(''):`<div class="empty">${state.empty&&!query&&!state.filtered?'还没有记录。把 QuickNote 存为第一条记录。':'没有匹配的记录。清除搜索或标签后再试。'}</div>`;
      $('todos').innerHTML=(p?['确认页头与封面样式','整理 Nori 角色素材','评审 QuickNote 发布流程']:['整理本周工作安排','确认页头与封面样式','整理访谈提纲']).map((x,i)=>`<div class="todo"><button class="circle" aria-label="完成 ${x}"></button><div><b>${x}</b><small>${p?'':i===0?'工作区':i===1?'品牌升级':'客户访谈'}</small></div></div>`).join('');$('files').innerHTML=['品牌视觉规范.pdf','Nori 角色素材.png','项目页设计稿.fig'].map((x,i)=>`<div class="file"><div class="file-icon">${['▣','▧','◆'][i]}</div><div><div class="file-name">${x}</div><small>${i?'昨天':'今天'}　·　${['2.4','1.8','12.6'][i]} MB</small></div><button class="more" aria-label="文件操作">···</button></div>`).join('');$('save').className='save'+(state.saveerror?' error':'');$('save').textContent=state.saveerror?'⚠　保存失败，重试':'●　已自动保存';}
    $('workspace').onclick=()=>{state.scope='workspace';render()};$('project').onclick=()=>{state.scope='project';render()};for(const k of ['filtered','empty','long','narrow','short','saveerror'])$(k).onclick=()=>{state[k]=!state[k];render()};$('search').oninput=render;$('more').onclick=()=>$('menu').hidden=!$('menu').hidden;$('expand').onclick=()=>{$('modal-editor').value=$('editor').innerText;$('modal').hidden=false;$('modal-editor').focus()};$('close').onclick=()=>{$('editor').innerText=$('modal-editor').value;$('modal').hidden=true;$('editor').focus()};$('modal-store').onclick=$('close').onclick;$('store').onclick=()=>{if(!$('editor').innerText.trim())return;$('save').textContent='●　转存中…';setTimeout(()=>{$('save').textContent='●　已自动保存'},900)};$('editor').oninput=()=>{$('save').textContent='●　保存中…';setTimeout(()=>{$('save').textContent='●　已自动保存'},600)};render();
  </script>
</body>
</html>
